services:
  postgres:
    image: postgres:16-alpine
    container_name: shynbaga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shynbaga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shynbaga
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shynbaga"]
      interval: 10s
      retries: 6

  collector:
    build: .
    image: shynbaga
    container_name: shynbaga-collector
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - shynbaga migrate; while true; do shynbaga collect --max-products 1000 --min-interval-hours 6; sleep 600; done
    environment:
      DATABASE_URL: postgresql://shynbaga:${POSTGRES_PASSWORD}@postgres:5432/shynbaga
      SHYNBAGA_PROXY_URLS: ${SHYNBAGA_PROXY_URLS:-}
      SHYNBAGA_REQUEST_DELAY: ${SHYNBAGA_REQUEST_DELAY:-10}
      SHYNBAGA_TELEGRAM_BOT_TOKEN: ${SHYNBAGA_TELEGRAM_BOT_TOKEN:-}
      SHYNBAGA_TELEGRAM_CHAT_ID: ${SHYNBAGA_TELEGRAM_CHAT_ID:-}
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
