services:
  postgres:
    image: postgres:16-alpine
    container_name: shinbaga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shinbaga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shinbaga
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinbaga"]
      interval: 10s
      retries: 6

  collector:
    build: .
    image: shinbaga
    container_name: shinbaga-collector
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - shinbaga migrate; while true; do shinbaga collect --max-products 1000 --min-interval-hours 23; sleep 3600; done
    environment:
      DATABASE_URL: postgresql://shinbaga:${POSTGRES_PASSWORD}@postgres:5432/shinbaga
      SHINBAGA_PROXY_URL: ${SHINBAGA_PROXY_URL:-}
      SHINBAGA_REQUEST_DELAY: ${SHINBAGA_REQUEST_DELAY:-10}
      SHINBAGA_TELEGRAM_BOT_TOKEN: ${SHINBAGA_TELEGRAM_BOT_TOKEN:-}
      SHINBAGA_TELEGRAM_CHAT_ID: ${SHINBAGA_TELEGRAM_CHAT_ID:-}
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
