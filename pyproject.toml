[project]
name = "shinbaga"
version = "0.1.0"
description = "Independent marketplace price history tracker"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shinbaga = "shinbaga.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shinbaga = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
