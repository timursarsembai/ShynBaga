services:
  postgres:
    image: postgres:16-alpine
    container_name: shinbaga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shinbaga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shinbaga
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m

volumes:
  pgdata:
